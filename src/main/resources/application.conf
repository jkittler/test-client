wsnew {
  host = "localhost"
  port = 2563
  path = "/wsnew"
  # The server binds the local-print WS listener with TLS (TcpServer withTLS=true),
  # so use wss://. trustAllCerts accepts the dev self-signed cert.
  tls = true
  trustAllCerts = true

  protocolVersion = 1
  applicationName = "wsnew-test-client"

  useHmac = true
  helloTimeoutSeconds = 10

  # Required at runtime (set in application.local.conf):
  # uuid, accountDomain, apiKey
  uuid = ""
  accountDomain = ""
  apiKey = ""

  # Optional JWT for InitiateUserSession. If blank and login.enabled=true, the
  # client logs in automatically (below) and uses that token.
  jwt = ""

  # Auto-login: fetch a fresh JWT from the public API so you never paste tokens.
  login {
    enabled = false
    host = ""          # default: accountDomain
    port = 7300
    userId = ""
    password = ""
    apiKey = ""        # default: wsnew.apiKey
  }

  sendRemoteDelivery = false
  remoteDelivery {
    # PRIMARY_UUID (server virtualMasterUuid); targetActorPath empty == request to primary.
    targetHost = "00000008-0008-0008-0008-000000000008"
    targetActorPath = ""
    providerId = 1
    document {
      uuid = ""
      name = "wsnew-test.pdf"
      inputPortName = "test-input"
    }
  }
}

wsnew {
  host = "localhost"
  port = 2563
  path = "/wsnew"
  # The server binds the local-print WS listener with TLS (TcpServer withTLS=true),
  # so use wss://. trustAllCerts accepts the dev self-signed cert.
  tls = true
  trustAllCerts = true

  protocolVersion = 1
  applicationName = "wsnew-test-client"

  useHmac = true
  helloTimeoutSeconds = 10

  # Required at runtime (set in application.local.conf):
  # uuid, accountDomain, apiKey
  uuid = ""
  accountDomain = ""
  apiKey = ""

  # Optional JWT for InitiateUserSession
  jwt = ""

  sendRemoteDelivery = false
  remoteDelivery {
    targetHost = "primary"
    targetActorPath = "/user/appMain"
    providerId = 1
    document {
      uuid = ""
      name = "wsnew-test.pdf"
    }
  }
}
